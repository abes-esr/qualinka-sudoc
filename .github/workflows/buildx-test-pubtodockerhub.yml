name: "buildx-test-pubtodockerhub"


# IMPORTANT : personnalisez cette variable pour que les images
# de votre application soient pousées sur dockerhub
# dans l'organisation/image docker ayant ce nom
# exemple, si vous indiquez : abesesr/abes-hello
#   alors l'image sera poussée sur https://hub.docker.com/r/abesesr/abes-hello
env:
  DOCKERHUB_IMAGE_PREFIX: abesesr/qualinka-sudoc


on:
  push:
    paths-ignore:
      - '**.md'
      - '.github/**'
  pull_request:
  workflow_dispatch:


jobs:
  buildx-test-pubtodockerhub:
    permissions:
      id-token: write
      attestations: write
      contents: read
    runs-on: ubuntu-latest
    steps:

      - name: "Build: checkout source code"
        uses: actions/checkout@v6
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
      - name: "Prepare version from git tags/branchs"
        id: docker_tag_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE_PREFIX }}
      - name: "Push: login to DockerHub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: "Buildx and push"
        id: push
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request'  && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')) }}
          target: web-image
          tags: ${{ steps.docker_tag_meta.outputs.tags }}
